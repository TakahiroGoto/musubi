<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EEF5F8"/>
      <stop offset="100%" stop-color="#E4EFF5"/>
    </linearGradient>
    <radialGradient id="bubbleG1" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.72"/>
      <stop offset="55%"  stop-color="#D8EEF8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A8D4E8" stop-opacity="0.10"/>
    </radialGradient>
    <radialGradient id="bubbleG2" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="white"   stop-opacity="0.65"/>
      <stop offset="55%"  stop-color="#D0E8F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#90C4DC" stop-opacity="0.08"/>
    </radialGradient>
    <radialGradient id="soapG" cx="38%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#F7F3EA"/>
      <stop offset="55%"  stop-color="#E8DFC9"/>
      <stop offset="100%" stop-color="#C9AB7C"/>
    </radialGradient>
    <radialGradient id="lightG" cx="50%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#EEF5F8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="534" fill="url(#bgG)"/>
  <rect width="800" height="534" fill="url(#lightG)"/>

  <!-- Soft background circles (depth) -->
  <circle cx="400" cy="267" r="260" fill="none" stroke="#A8D4E8" stroke-width="0.6" opacity="0.18"/>
  <circle cx="400" cy="267" r="340" fill="none" stroke="#A8D4E8" stroke-width="0.4" opacity="0.12"/>

  <!-- LARGE BUBBLE (main, center) -->
  <circle cx="400" cy="250" r="130" fill="url(#bubbleG1)" stroke="#B8D8E8" stroke-width="1.5"/>
  <!-- Bubble highlight -->
  <ellipse cx="358" cy="200" rx="38" ry="22" fill="white" opacity="0.42" transform="rotate(-20 358 200)"/>
  <ellipse cx="345" cy="194" rx="18" ry="10" fill="white" opacity="0.55" transform="rotate(-20 345 194)"/>
  <!-- Bubble edge shimmer -->
  <circle cx="400" cy="250" r="130" fill="none" stroke="white" stroke-width="2" opacity="0.30"/>

  <!-- MEDIUM BUBBLE upper-left -->
  <circle cx="188" cy="168" r="78" fill="url(#bubbleG2)" stroke="#B8D8E8" stroke-width="1.2"/>
  <ellipse cx="166" cy="140" rx="22" ry="13" fill="white" opacity="0.40" transform="rotate(-22 166 140)"/>
  <ellipse cx="158" cy="136" rx="10" ry="6"  fill="white" opacity="0.50" transform="rotate(-22 158 136)"/>
  <circle cx="188" cy="168" r="78"  fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>

  <!-- MEDIUM BUBBLE upper-right -->
  <circle cx="622" cy="148" r="88" fill="url(#bubbleG1)" stroke="#B8D8E8" stroke-width="1.2"/>
  <ellipse cx="596" cy="118" rx="26" ry="15" fill="white" opacity="0.40" transform="rotate(-18 596 118)"/>
  <ellipse cx="586" cy="114" rx="12" ry="7"  fill="white" opacity="0.52" transform="rotate(-18 586 114)"/>
  <circle cx="622" cy="148" r="88"  fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>

  <!-- SMALL BUBBLE top-center -->
  <circle cx="448" cy="72" r="42" fill="url(#bubbleG2)" stroke="#B8D8E8" stroke-width="1"/>
  <ellipse cx="434" cy="55" rx="12" ry="7"  fill="white" opacity="0.45" transform="rotate(-20 434 55)"/>
  <circle cx="448" cy="72" r="42"   fill="none" stroke="white" stroke-width="1" opacity="0.22"/>

  <!-- SMALL BUBBLE left -->
  <circle cx="92" cy="310" r="48" fill="url(#bubbleG1)" stroke="#B8D8E8" stroke-width="1"/>
  <ellipse cx="76" cy="292" rx="14" ry="8" fill="white" opacity="0.42" transform="rotate(-20 76 292)"/>
  <circle cx="92" cy="310" r="48"  fill="none" stroke="white" stroke-width="1" opacity="0.22"/>

  <!-- SMALL BUBBLE right-bottom -->
  <circle cx="698" cy="342" r="54" fill="url(#bubbleG2)" stroke="#B8D8E8" stroke-width="1"/>
  <ellipse cx="680" cy="322" rx="16" ry="9" fill="white" opacity="0.40" transform="rotate(-18 680 322)"/>
  <circle cx="698" cy="342" r="54"  fill="none" stroke="white" stroke-width="1" opacity="0.20"/>

  <!-- TINY BUBBLES scattered -->
  <g stroke="#B8D8E8" fill="none">
    <circle cx="300" cy="88"  r="20" stroke-width="0.8" opacity="0.55"/>
    <ellipse cx="292" cy="80" rx="5" ry="3" fill="white" opacity="0.35" stroke="none"/>
    <circle cx="560" cy="310" r="24" stroke-width="0.8" opacity="0.50"/>
    <ellipse cx="552" cy="302" rx="6" ry="4" fill="white" opacity="0.35" stroke="none"/>
    <circle cx="140" cy="420" r="18" stroke-width="0.8" opacity="0.45"/>
    <circle cx="680" cy="200" r="15" stroke-width="0.7" opacity="0.45"/>
    <circle cx="340" cy="460" r="22" stroke-width="0.8" opacity="0.45"/>
    <ellipse cx="332" cy="452" rx="5" ry="3" fill="white" opacity="0.30" stroke="none"/>
    <circle cx="500" cy="440" r="16" stroke-width="0.7" opacity="0.40"/>
    <circle cx="60"  cy="190" r="14" stroke-width="0.7" opacity="0.40"/>
    <circle cx="740" cy="440" r="20" stroke-width="0.8" opacity="0.42"/>
    <circle cx="200" cy="480" r="12" stroke-width="0.7" opacity="0.38"/>
  </g>

  <!-- SOAP BAR (center of main bubble) -->
  <!-- Soap body -->
  <rect x="340" y="216" width="120" height="68" rx="10"
        fill="url(#soapG)" stroke="#C9AB7C" stroke-width="1.5"/>
  <!-- Soap sheen -->
  <ellipse cx="372" cy="228" rx="24" ry="10" fill="white" opacity="0.30" transform="rotate(-8 372 228)"/>
  <!-- Soap brand mark -->
  <text x="400" y="248" text-anchor="middle"
        font-family="serif" font-size="11" font-weight="400"
        fill="#5A4030" opacity="0.75" letter-spacing="0.15em">無添加</text>
  <line x1="352" y1="256" x2="448" y2="256" stroke="#C9AB7C" stroke-width="0.8" opacity="0.50"/>
  <text x="400" y="270" text-anchor="middle"
        font-family="serif" font-size="9"
        fill="#8A7060" opacity="0.65" letter-spacing="0.2em">石けん</text>
  <!-- Soap shadow -->
  <ellipse cx="400" cy="286" rx="52" ry="8" fill="#A8C4D0" opacity="0.15"/>

  <!-- Water droplets on/around soap -->
  <g fill="#B8D8E8" opacity="0.65">
    <ellipse cx="336" cy="230" rx="3.5" ry="5.5" transform="rotate(-15 336 230)"/>
    <ellipse cx="464" cy="242" rx="3"   ry="5"   transform="rotate(20 464 242)"/>
    <ellipse cx="344" cy="268" rx="2.5" ry="4"   transform="rotate(-8 344 268)"/>
    <ellipse cx="458" cy="222" rx="2.5" ry="4"   transform="rotate(12 458 222)"/>
  </g>

  <!-- Bubble string (connecting bubbles, subtle) -->
  <path d="M 266,168 C 300,200 340,220 400,250" fill="none" stroke="#B8D8E8" stroke-width="0.6" opacity="0.20"/>
  <path d="M 534,148 C 510,180 460,210 400,250" fill="none" stroke="#B8D8E8" stroke-width="0.6" opacity="0.20"/>

  <!-- Bottom text -->
  <text x="400" y="516" text-anchor="middle"
        font-family="serif" font-size="12" fill="#6A9AB0" opacity="0.42" letter-spacing="10">無 添 加 の 石 け ん</text>
</svg>
