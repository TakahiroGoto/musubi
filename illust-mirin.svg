<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534">
  <defs>
    <radialGradient id="nightBg" cx="68%" cy="22%" r="65%">
      <stop offset="0%"   stop-color="#2D1A08"/>
      <stop offset="55%"  stop-color="#1A0C04"/>
      <stop offset="100%" stop-color="#0D0702"/>
    </radialGradient>
    <radialGradient id="moonHalo" cx="68%" cy="18%" r="30%">
      <stop offset="0%"   stop-color="#C9AB7C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0D0702" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vesselG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2D1A08"/>
      <stop offset="22%"  stop-color="#4A2E12"/>
      <stop offset="45%"  stop-color="#6B4020"/>
      <stop offset="68%"  stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#2D1A08"/>
    </linearGradient>
    <radialGradient id="vesselSheen" cx="35%" cy="35%" r="50%">
      <stop offset="0%"   stop-color="#9B7D3A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2D1A08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="10%" r="80%">
      <stop offset="0%"   stop-color="#9B7D3A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0D0702" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night background -->
  <rect width="800" height="534" fill="url(#nightBg)"/>
  <rect width="800" height="534" fill="url(#moonHalo)"/>

  <!-- Stars -->
  <g fill="#C9AB7C">
    <circle cx="90"  cy="48"  r="1.4" opacity="0.50"/>
    <circle cx="180" cy="78"  r="0.9" opacity="0.38"/>
    <circle cx="145" cy="140" r="1.6" opacity="0.45"/>
    <circle cx="240" cy="55"  r="1.1" opacity="0.40"/>
    <circle cx="310" cy="90"  r="0.8" opacity="0.32"/>
    <circle cx="55"  cy="200" r="1.0" opacity="0.38"/>
    <circle cx="750" cy="55"  r="1.3" opacity="0.48"/>
    <circle cx="700" cy="130" r="0.9" opacity="0.35"/>
    <circle cx="770" cy="200" r="1.4" opacity="0.42"/>
    <circle cx="130" cy="310" r="0.8" opacity="0.28"/>
    <circle cx="680" cy="290" r="1.0" opacity="0.32"/>
    <circle cx="50"  cy="380" r="0.7" opacity="0.25"/>
    <circle cx="740" cy="380" r="0.8" opacity="0.28"/>
  </g>

  <!-- Moon -->
  <circle cx="605" cy="92"  r="80"  fill="#C9AB7C" opacity="0.08"/>
  <circle cx="605" cy="92"  r="60"  fill="#C9AB7C" opacity="0.14"/>
  <circle cx="605" cy="92"  r="44"  fill="#C9AB7C" opacity="0.32"/>
  <circle cx="605" cy="92"  r="32"  fill="#9B7D3A" opacity="0.82"/>
  <!-- Moon surface details -->
  <circle cx="593" cy="82"  r="7"   fill="#7A6A30" opacity="0.38"/>
  <circle cx="614" cy="100" r="4.5" fill="#7A6A30" opacity="0.30"/>
  <circle cx="600" cy="100" r="3"   fill="#7A6A30" opacity="0.22"/>

  <!-- Floor glow (warm light under vessel) -->
  <ellipse cx="400" cy="460" rx="210" ry="35" fill="#9B7D3A" opacity="0.14"/>
  <rect width="800" height="534" fill="url(#floorGlow)"/>

  <!-- Vessel shadow -->
  <ellipse cx="400" cy="455" rx="175" ry="20" fill="#0D0702" opacity="0.80"/>

  <!-- VESSEL BODY -->
  <!-- Wide-belly traditional earthen jar (かめ) -->
  <path d="M 308,178
           C 294,178 252,218 226,290
           C 205,350 228,408 262,434
           L 538,434
           C 572,408 595,350 574,290
           C 548,218 506,178 492,178
           C 450,160 350,160 308,178 Z"
        fill="url(#vesselG)" stroke="#9B7D3A" stroke-width="2.2"/>
  <!-- Sheen overlay -->
  <path d="M 308,178
           C 294,178 252,218 226,290
           C 205,350 228,408 262,434
           L 538,434
           C 572,408 595,350 574,290
           C 548,218 506,178 492,178
           C 450,160 350,160 308,178 Z"
        fill="url(#vesselSheen)"/>

  <!-- Vessel texture: horizontal ring lines -->
  <path d="M 230,296 C 270,284 334,279 400,279 C 466,279 530,284 570,296"
        fill="none" stroke="#9B7D3A" stroke-width="1.2" opacity="0.32"/>
  <path d="M 228,334 C 268,323 333,318 400,318 C 467,318 532,323 572,334"
        fill="none" stroke="#9B7D3A" stroke-width="1"   opacity="0.27"/>
  <path d="M 235,370 C 273,360 337,355 400,355 C 463,355 527,360 565,370"
        fill="none" stroke="#9B7D3A" stroke-width="0.9" opacity="0.22"/>
  <path d="M 248,404 C 284,396 344,391 400,391 C 456,391 516,396 552,404"
        fill="none" stroke="#9B7D3A" stroke-width="0.8" opacity="0.18"/>

  <!-- Left side highlight -->
  <path d="M 246,268 C 236,300 240,355 254,385"
        fill="none" stroke="#9B7D3A" stroke-width="4" stroke-linecap="round" opacity="0.12"/>
  <path d="M 248,270 C 238,302 242,357 256,387"
        fill="none" stroke="#C9AB7C" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>

  <!-- Vessel neck -->
  <path d="M 316,178 C 316,165 352,156 400,156 C 448,156 484,165 484,178"
        fill="#4A2E12" stroke="#9B7D3A" stroke-width="2"/>

  <!-- Mouth opening (top of neck) -->
  <ellipse cx="400" cy="156" rx="84" ry="20" fill="#1A0C04" stroke="#9B7D3A" stroke-width="2"/>
  <ellipse cx="400" cy="153" rx="72" ry="16" fill="none" stroke="#C9AB7C" stroke-width="1" opacity="0.40"/>
  <!-- Liquid surface glow inside mouth -->
  <ellipse cx="400" cy="162" rx="62" ry="12" fill="#9B7D3A" opacity="0.18"/>

  <!-- Fermentation bubbles rising -->
  <g fill="none" stroke-linecap="round">
    <circle cx="388" cy="136" r="3.5" stroke="#C9AB7C" stroke-width="1.1" opacity="0.55"/>
    <circle cx="412" cy="110" r="4.5" stroke="#C9AB7C" stroke-width="1.1" opacity="0.50"/>
    <circle cx="396" cy="84"  r="3.8" stroke="#C9AB7C" stroke-width="1"   opacity="0.44"/>
    <circle cx="418" cy="58"  r="3"   stroke="#C9AB7C" stroke-width="0.9" opacity="0.38"/>
    <circle cx="374" cy="64"  r="3.2" stroke="#C9AB7C" stroke-width="0.9" opacity="0.36"/>
    <circle cx="406" cy="34"  r="2.2" stroke="#9B7D3A" stroke-width="0.8" opacity="0.30"/>
    <circle cx="382" cy="28"  r="1.6" stroke="#9B7D3A" stroke-width="0.7" opacity="0.25"/>
  </g>

  <!-- Rice grains scattered on floor -->
  <g fill="#EDE5D0" opacity="0.48">
    <ellipse cx="148" cy="358" rx="5"   ry="11"  transform="rotate(-28 148 358)"/>
    <ellipse cx="192" cy="300" rx="4.5" ry="9.5" transform="rotate(18 192 300)"/>
    <ellipse cx="130" cy="408" rx="5"   ry="10"  transform="rotate(-8 130 408)"/>
    <ellipse cx="108" cy="448" rx="4"   ry="8.5" transform="rotate(22 108 448)"/>
    <ellipse cx="626" cy="340" rx="5"   ry="11"  transform="rotate(32 626 340)"/>
    <ellipse cx="668" cy="388" rx="4.5" ry="9.5" transform="rotate(-18 668 388)"/>
    <ellipse cx="608" cy="412" rx="5"   ry="10"  transform="rotate(10 608 412)"/>
    <ellipse cx="652" cy="450" rx="4"   ry="8.5" transform="rotate(-25 652 450)"/>
    <ellipse cx="175" cy="480" rx="4"   ry="8"   transform="rotate(15 175 480)"/>
    <ellipse cx="625" cy="476" rx="4"   ry="8"   transform="rotate(-12 625 476)"/>
  </g>

  <!-- Background kanji 醸 (faint watermark) -->
  <text x="80" y="480" font-family="serif" font-size="180"
        fill="#9B7D3A" opacity="0.035" transform="rotate(-8 80 480)">醸</text>

  <!-- Bottom text -->
  <text x="400" y="516" text-anchor="middle"
        font-family="serif" font-size="12" fill="#9B7D3A" opacity="0.48" letter-spacing="10">六 十 日 の 醸 成</text>
</svg>
